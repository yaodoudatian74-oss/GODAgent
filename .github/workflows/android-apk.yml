name: Build Android APK & Release

# Publishes the GODAgent Android APK to a GitHub Release.
#
# The repo ships a ready, validated APK at dist-apk/GODAgent.apk (built without
# the Android SDK — see apk-nosdk/). This workflow attaches that APK to a
# Release. It also tries a full Capacitor/Gradle build on GitHub's runners (they
# can reach Google's SDK) and, if that succeeds, uploads it as an extra artifact.
#
# Trigger (either works):
#   - push a tag:      git tag v0.1.0 && git push origin v0.1.0
#   - or, from the Actions tab: "Run workflow" (after this file is on the
#     default branch), entering a tag like v0.1.0.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the prebuilt APK exists
        run: |
          test -f dist-apk/GODAgent.apk
          ls -la dist-apk/GODAgent.apk

      - name: Create / update the Release and attach the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: GODAgent ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            GODAgent — Android アプリ（APK）。

            インストール（Android のみ）:
            1. `GODAgent.apk` をダウンロード
            2. 開いて「提供元不明のアプリ」を許可
            3. インストール → ホームの GODAgent を起動（オフライン動作）

            ※ 以前のバージョンを入れている場合は、署名キーが異なるため一度
            アンインストールしてからインストールしてください。iPhone は非対応です。
          files: dist-apk/GODAgent.apk
          fail_on_unmatched_files: true

  # Optional: a full Capacitor/Gradle build with the official toolchain.
  # Non-blocking — the Release above already carries the APK.
  capacitor-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Build standalone web + APK
        working-directory: web
        run: |
          npm ci
          VITE_STANDALONE=1 npx vite build --base=./ --outDir dist-standalone
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GODAgent-capacitor-apk
          path: web/android/app/build/outputs/apk/**/*.apk
