<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mail</title>
<link rel="stylesheet" href="/computer-apps/_style.css"></head><body>
<div class="topbar"><span class="brand">✉ Mailbox</span><span class="tab active">Inbox</span><span class="tab">Drafts</span><span class="tab">Sent</span></div>
<div class="wrap"><div class="side"><a class="active">Inbox (3)</a><a>Starred</a><a>Drafts</a><a>Sent</a></div>
<div class="main"><div class="h1">Compose</div><div class="sub">Draft held for your review</div>
<div class="card"><div class="field"><label>To</label><input value="vicky@globex.example"></div>

<div class="field"><label>Body</label><textarea rows="6">Hi Vicky,

Following up on our note — I'd love to find 20 minutes this week. Does Thursday work?

Best,</textarea></div>
<button class="btn" id="send">Send</button> <button class="btn ghost">Save draft</button></div>
</div></div></body></html>
