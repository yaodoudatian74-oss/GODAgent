<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Web</title>
<link rel="stylesheet" href="/computer-apps/_style.css"></head><body style="background:#fff">
<div class="topbar" style="background:#fff;color:#1a1a1a;border-bottom:1px solid #e3e8ef">
<span class="brand">🔎 Finder</span>
<input id="q" style="margin:0;max-width:520px" placeholder="Search the web"></div>
<div class="main"><div id="res"></div></div>
<script>
const q = new URLSearchParams(location.search).get('q') || 'market research';
document.getElementById('q').value = q;
const hosts = ['acme-research.example','brightdata.example','marketpulse.example','contextwire.example'];
document.getElementById('res').innerHTML = `<div class="sub">About 4 results for “${q}”</div>` +
  hosts.map((h,i)=>`<div class="card"><a style="color:#1a56db;font-size:16px;text-decoration:none">${q} — overview ${i+1}</a>
  <div style="color:#188038;font-size:12px">${h}</div>
  <div style="color:#4b5563;font-size:13px">A concise look at ${q}, including context on contacts, accounts and recent signals relevant to outreach.</div></div>`).join('');
</script></body></html>
