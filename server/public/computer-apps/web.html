<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ウェブ</title>
<link rel="stylesheet" href="/computer-apps/_style.css"></head><body style="background:#fff">
<div class="topbar" style="background:#fff;color:#1a1a1a;border-bottom:1px solid #e3e8ef">
<span class="brand">🔎 ファインダー</span>
<input id="q" style="margin:0;max-width:520px" placeholder="ウェブを検索"></div>
<div class="main"><div id="res"></div></div>
<script>
const q = new URLSearchParams(location.search).get('q') || '市場調査';
document.getElementById('q').value = q;
const hosts = ['acme-research.example','brightdata.example','marketpulse.example','contextwire.example'];
document.getElementById('res').innerHTML = `<div class="sub">「${q}」の検索結果 約4件</div>` +
  hosts.map((h,i)=>`<div class="card"><a style="color:#1a56db;font-size:16px;text-decoration:none">${q} — 概要 ${i+1}</a>
  <div style="color:#188038;font-size:12px">${h}</div>
  <div style="color:#4b5563;font-size:13px">${q} の要点をまとめた記事。アウトリーチに関連する連絡先・取引先・最近の動きの背景情報を含みます。</div></div>`).join('');
</script></body></html>
